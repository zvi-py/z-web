<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" style="background:#0D0D0D;font-family:'Inter',system-ui,-apple-system,sans-serif;">
  <defs>
    <!-- Grid Pattern -->
    <pattern id="brutalist-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#EEEDE4" stroke-width="0.75" stroke-opacity="0.05"/>
    </pattern>
    <linearGradient id="grad-cover_finova" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <!-- Deep Obsidian Canvas -->
  <rect width="1600" height="900" fill="#0E0E0E"/>
  <rect width="1600" height="900" fill="url(#brutalist-grid)"/>

  <!-- Center Graphic Artwork -->
  
          <defs>
            <radialGradient id="finovaglow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.35"/>
              <stop offset="60%" stop-color="#10B981" stop-opacity="0.12"/>
              <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <circle cx="800" cy="450" r="350" fill="url(#finovaglow)"/>
          <!-- Candlestick Visuals -->
          <line x1="560" y1="360" x2="560" y2="520" stroke="#10B981" stroke-width="2"/>
          <rect x="548" y="390" width="24" height="80" rx="3" fill="#10B981"/>
          <line x1="680" y1="320" x2="680" y2="490" stroke="#F59E0B" stroke-width="2"/>
          <rect x="668" y="350" width="24" height="90" rx="3" fill="#F59E0B"/>
          <line x1="800" y1="280" x2="800" y2="460" stroke="#10B981" stroke-width="2"/>
          <rect x="788" y="300" width="24" height="110" rx="3" fill="#10B981"/>
          <line x1="920" y1="260" x2="920" y2="430" stroke="#10B981" stroke-width="2"/>
          <rect x="908" y="270" width="24" height="100" rx="3" fill="#10B981"/>
          <line x1="1040" y1="230" x2="1040" y2="390" stroke="#F59E0B" stroke-width="2"/>
          <rect x="1028" y="250" width="24" height="80" rx="3" fill="#F59E0B"/>
        

  <!-- Technical Brutalist Frame Overlay -->
  <rect x="30" y="30" width="1540" height="840" fill="none" stroke="#EEEDE4" stroke-width="1" stroke-opacity="0.12"/>
  <rect x="36" y="36" width="1528" height="828" fill="none" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Corner Reticle Ticks -->
  <path d="M 30 70 L 30 30 L 70 30" fill="none" stroke="#F59E0B" stroke-width="3"/>
  <path d="M 1570 70 L 1570 30 L 1530 30" fill="none" stroke="#F59E0B" stroke-width="3"/>
  <path d="M 30 830 L 30 870 L 70 870" fill="none" stroke="#F59E0B" stroke-width="3"/>
  <path d="M 1570 830 L 1570 870 L 1530 870" fill="none" stroke="#F59E0B" stroke-width="3"/>

  <!-- Top System Badge -->
  <g transform="translate(60, 75)">
    <rect width="190" height="32" rx="4" fill="#181818" stroke="#EEEDE4" stroke-opacity="0.2"/>
    <circle cx="20" cy="16" r="4.5" fill="#F59E0B"/>
    <text x="36" y="21" fill="#EEEDE4" font-family="'Fragment Mono',monospace" font-size="12" font-weight="600" letter-spacing="2">09 // AI FINTECH</text>
  </g>

  <!-- Top Right Serial Stamp -->
  <g transform="translate(1360, 75)">
    <text x="180" y="21" fill="#EEEDE4" fill-opacity="0.45" font-family="'Fragment Mono',monospace" font-size="12" letter-spacing="2" text-anchor="end">SYS-ID // 2026.REL</text>
  </g>

  <!-- Bottom Title Block -->
  <g transform="translate(60, 730)">
    <text x="0" y="0" fill="#EEEDE4" font-family="'Inter Display','Inter',sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5">FINOVA</text>
    <text x="0" y="34" fill="#F59E0B" font-family="'Fragment Mono',monospace" font-size="14" font-weight="600" letter-spacing="3">AUTONOMOUS WEALTH COPILOT &amp; TIME-SERIES</text>
  </g>

  <!-- Bottom Right Specs Readout -->
  <g transform="translate(1540, 725)">
    <text x="0" y="-36" fill="#EEEDE4" fill-opacity="0.75" font-family="'Fragment Mono',monospace" font-size="13" letter-spacing="1" text-anchor="end">MODEL: LSTM Neural Net</text>
    <text x="0" y="-12" fill="#EEEDE4" fill-opacity="0.75" font-family="'Fragment Mono',monospace" font-size="13" letter-spacing="1" text-anchor="end">FORECAST: 90-Day P&amp;L</text>
    <text x="0" y="12" fill="#F59E0B" font-family="'Fragment Mono',monospace" font-size="13" font-weight="600" letter-spacing="1" text-anchor="end">STACK: FastAPI • TensorFlow • React</text>
  </g>
</svg>