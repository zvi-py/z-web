<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" style="background:#0D0D0D;font-family:'Inter',system-ui,-apple-system,sans-serif;">
  <defs>
    <!-- Grid Pattern -->
    <pattern id="brutalist-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#EEEDE4" stroke-width="0.75" stroke-opacity="0.05"/>
    </pattern>
    <linearGradient id="grad-cover_drive" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5500"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Deep Obsidian Canvas -->
  <rect width="1600" height="900" fill="#0E0E0E"/>
  <rect width="1600" height="900" fill="url(#brutalist-grid)"/>

  <!-- Center Graphic Artwork -->
  
          <defs>
            <radialGradient id="driveglow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#FF5500" stop-opacity="0.38"/>
              <stop offset="60%" stop-color="#F59E0B" stop-opacity="0.14"/>
              <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <circle cx="800" cy="450" r="350" fill="url(#driveglow)"/>
          <!-- DAG Graph Orchestrator -->
          <circle cx="580" cy="450" r="42" fill="#181818" stroke="#FF5500" stroke-width="2.5"/>
          <text x="580" y="456" fill="#EEEDE4" font-family="'Fragment Mono',monospace" font-size="13" font-weight="700" text-anchor="middle">INPUT</text>
          <circle cx="800" cy="330" r="48" fill="#181818" stroke="#F59E0B" stroke-width="2.5"/>
          <text x="800" y="335" fill="#EEEDE4" font-family="'Fragment Mono',monospace" font-size="12" font-weight="700" text-anchor="middle">SYNTHESIS</text>
          <circle cx="800" cy="570" r="48" fill="#181818" stroke="#F59E0B" stroke-width="2.5"/>
          <text x="800" y="575" fill="#EEEDE4" font-family="'Fragment Mono',monospace" font-size="12" font-weight="700" text-anchor="middle">CRITIC</text>
          <circle cx="1020" cy="450" r="42" fill="#181818" stroke="#FF5500" stroke-width="2.5"/>
          <text x="1020" y="456" fill="#EEEDE4" font-family="'Fragment Mono',monospace" font-size="13" font-weight="700" text-anchor="middle">EXEC</text>
          <line x1="622" y1="450" x2="752" y2="330" stroke="#FF5500" stroke-width="2" stroke-dasharray="6 4"/>
          <line x1="622" y1="450" x2="752" y2="570" stroke="#FF5500" stroke-width="2" stroke-dasharray="6 4"/>
          <line x1="848" y1="330" x2="978" y2="450" stroke="#F59E0B" stroke-width="2" stroke-dasharray="6 4"/>
          <line x1="848" y1="570" x2="978" y2="450" stroke="#F59E0B" stroke-width="2" stroke-dasharray="6 4"/>
        

  <!-- Technical Brutalist Frame Overlay -->
  <rect x="30" y="30" width="1540" height="840" fill="none" stroke="#EEEDE4" stroke-width="1" stroke-opacity="0.12"/>
  <rect x="36" y="36" width="1528" height="828" fill="none" stroke="#FF5500" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Corner Reticle Ticks -->
  <path d="M 30 70 L 30 30 L 70 30" fill="none" stroke="#FF5500" stroke-width="3"/>
  <path d="M 1570 70 L 1570 30 L 1530 30" fill="none" stroke="#FF5500" stroke-width="3"/>
  <path d="M 30 830 L 30 870 L 70 870" fill="none" stroke="#FF5500" stroke-width="3"/>
  <path d="M 1570 830 L 1570 870 L 1530 870" fill="none" stroke="#FF5500" stroke-width="3"/>

  <!-- Top System Badge -->
  <g transform="translate(60, 75)">
    <rect width="190" height="32" rx="4" fill="#181818" stroke="#EEEDE4" stroke-opacity="0.2"/>
    <circle cx="20" cy="16" r="4.5" fill="#FF5500"/>
    <text x="36" y="21" fill="#EEEDE4" font-family="'Fragment Mono',monospace" font-size="12" font-weight="600" letter-spacing="2">05 // RESEARCH ENGINE</text>
  </g>

  <!-- Top Right Serial Stamp -->
  <g transform="translate(1360, 75)">
    <text x="180" y="21" fill="#EEEDE4" fill-opacity="0.45" font-family="'Fragment Mono',monospace" font-size="12" letter-spacing="2" text-anchor="end">SYS-ID // 2026.REL</text>
  </g>

  <!-- Bottom Title Block -->
  <g transform="translate(60, 730)">
    <text x="0" y="0" fill="#EEEDE4" font-family="'Inter Display','Inter',sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5">DRIVE</text>
    <text x="0" y="34" fill="#FF5500" font-family="'Fragment Mono',monospace" font-size="14" font-weight="600" letter-spacing="3">AUTONOMOUS MULTI-AGENT RESEARCH ENGINE</text>
  </g>

  <!-- Bottom Right Specs Readout -->
  <g transform="translate(1540, 725)">
    <text x="0" y="-36" fill="#EEEDE4" fill-opacity="0.75" font-family="'Fragment Mono',monospace" font-size="13" letter-spacing="1" text-anchor="end">AGENT SWARM: 8 Nodes</text>
    <text x="0" y="-12" fill="#EEEDE4" fill-opacity="0.75" font-family="'Fragment Mono',monospace" font-size="13" letter-spacing="1" text-anchor="end">MODEL: Gemini 2.5 Flash</text>
    <text x="0" y="12" fill="#FF5500" font-family="'Fragment Mono',monospace" font-size="13" font-weight="600" letter-spacing="1" text-anchor="end">TOPOLOGY: Directed Acyclic Graph</text>
  </g>
</svg>