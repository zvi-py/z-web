<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" style="background:#0D0D0D;font-family:'Inter',system-ui,-apple-system,sans-serif;">
  <defs>
    <!-- Grid Pattern -->
    <pattern id="brutalist-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#EEEDE4" stroke-width="0.75" stroke-opacity="0.05"/>
    </pattern>
    <linearGradient id="grad-cover_aurael" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <!-- Deep Obsidian Canvas -->
  <rect width="1600" height="900" fill="#0E0E0E"/>
  <rect width="1600" height="900" fill="url(#brutalist-grid)"/>

  <!-- Center Graphic Artwork -->
  
          <defs>
            <radialGradient id="auraglow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.35"/>
              <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.15"/>
              <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <circle cx="800" cy="450" r="340" fill="url(#auraglow)"/>
          <!-- Neural Waveforms -->
          <path d="M 300 450 Q 550 250 800 450 T 1300 450" fill="none" stroke="#00F0FF" stroke-width="3" opacity="0.8"/>
          <path d="M 300 450 Q 550 650 800 450 T 1300 450" fill="none" stroke="#8B5CF6" stroke-width="3" opacity="0.8"/>
          <circle cx="800" cy="450" r="140" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="6 6"/>
          <circle cx="800" cy="450" r="80" fill="none" stroke="#8B5CF6" stroke-width="2"/>
          <circle cx="800" cy="450" r="12" fill="#00F0FF"/>
          <!-- Synapse Nodes -->
          <circle cx="550" cy="350" r="6" fill="#00F0FF"/><circle cx="1050" cy="550" r="6" fill="#8B5CF6"/>
          <line x1="550" y1="350" x2="800" y2="450" stroke="#00F0FF" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>
          <line x1="1050" y1="550" x2="800" y2="450" stroke="#8B5CF6" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>
        

  <!-- Technical Brutalist Frame Overlay -->
  <rect x="30" y="30" width="1540" height="840" fill="none" stroke="#EEEDE4" stroke-width="1" stroke-opacity="0.12"/>
  <rect x="36" y="36" width="1528" height="828" fill="none" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Corner Reticle Ticks -->
  <path d="M 30 70 L 30 30 L 70 30" fill="none" stroke="#00F0FF" stroke-width="3"/>
  <path d="M 1570 70 L 1570 30 L 1530 30" fill="none" stroke="#00F0FF" stroke-width="3"/>
  <path d="M 30 830 L 30 870 L 70 870" fill="none" stroke="#00F0FF" stroke-width="3"/>
  <path d="M 1570 830 L 1570 870 L 1530 870" fill="none" stroke="#00F0FF" stroke-width="3"/>

  <!-- Top System Badge -->
  <g transform="translate(60, 75)">
    <rect width="190" height="32" rx="4" fill="#181818" stroke="#EEEDE4" stroke-opacity="0.2"/>
    <circle cx="20" cy="16" r="4.5" fill="#00F0FF"/>
    <text x="36" y="21" fill="#EEEDE4" font-family="'Fragment Mono',monospace" font-size="12" font-weight="600" letter-spacing="2">01 // AGENTIC AI</text>
  </g>

  <!-- Top Right Serial Stamp -->
  <g transform="translate(1360, 75)">
    <text x="180" y="21" fill="#EEEDE4" fill-opacity="0.45" font-family="'Fragment Mono',monospace" font-size="12" letter-spacing="2" text-anchor="end">SYS-ID // 2026.REL</text>
  </g>

  <!-- Bottom Title Block -->
  <g transform="translate(60, 730)">
    <text x="0" y="0" fill="#EEEDE4" font-family="'Inter Display','Inter',sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5">AURAEL</text>
    <text x="0" y="34" fill="#00F0FF" font-family="'Fragment Mono',monospace" font-size="14" font-weight="600" letter-spacing="3">AGENTIC AI &amp; NEURAL WELLNESS</text>
  </g>

  <!-- Bottom Right Specs Readout -->
  <g transform="translate(1540, 725)">
    <text x="0" y="-36" fill="#EEEDE4" fill-opacity="0.75" font-family="'Fragment Mono',monospace" font-size="13" letter-spacing="1" text-anchor="end">LATENCY: 110ms</text>
    <text x="0" y="-12" fill="#EEEDE4" fill-opacity="0.75" font-family="'Fragment Mono',monospace" font-size="13" letter-spacing="1" text-anchor="end">SENTIMENT: 99.2%</text>
    <text x="0" y="12" fill="#00F0FF" font-family="'Fragment Mono',monospace" font-size="13" font-weight="600" letter-spacing="1" text-anchor="end">STACK: React • Firebase • Voice AI</text>
  </g>
</svg>