<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" style="background:#0D0D0D;font-family:'Inter',system-ui,-apple-system,sans-serif;">
  <defs>
    <!-- Grid Pattern -->
    <pattern id="brutalist-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#EEEDE4" stroke-width="0.75" stroke-opacity="0.05"/>
    </pattern>
    <linearGradient id="grad-cover_heart_calc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A55"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
  </defs>

  <!-- Deep Obsidian Canvas -->
  <rect width="1600" height="900" fill="#0E0E0E"/>
  <rect width="1600" height="900" fill="url(#brutalist-grid)"/>

  <!-- Center Graphic Artwork -->
  
          <defs>
            <radialGradient id="cardiacglow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#FF2A55" stop-opacity="0.38"/>
              <stop offset="60%" stop-color="#881337" stop-opacity="0.14"/>
              <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <circle cx="800" cy="450" r="350" fill="url(#cardiacglow)"/>
          <!-- Active ECG Heartbeat Waveform -->
          <path d="M 350 450 L 580 450 L 610 400 L 640 450 L 680 450 L 710 520 L 750 250 L 800 580 L 840 420 L 880 450 L 920 420 L 960 450 L 1250 450" fill="none" stroke="#FF2A55" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="750" cy="250" r="7" fill="#FFFFFF"/>
          <!-- Clinical Grid Background -->
          <line x1="350" y1="350" x2="1250" y2="350" stroke="#FF2A55" stroke-width="1" stroke-dasharray="4 4" opacity="0.3"/>
          <line x1="350" y1="550" x2="1250" y2="550" stroke="#FF2A55" stroke-width="1" stroke-dasharray="4 4" opacity="0.3"/>
          <circle cx="800" cy="450" r="180" fill="none" stroke="#FF2A55" stroke-width="1.5" stroke-dasharray="10 8" opacity="0.4"/>
        

  <!-- Technical Brutalist Frame Overlay -->
  <rect x="30" y="30" width="1540" height="840" fill="none" stroke="#EEEDE4" stroke-width="1" stroke-opacity="0.12"/>
  <rect x="36" y="36" width="1528" height="828" fill="none" stroke="#FF2A55" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Corner Reticle Ticks -->
  <path d="M 30 70 L 30 30 L 70 30" fill="none" stroke="#FF2A55" stroke-width="3"/>
  <path d="M 1570 70 L 1570 30 L 1530 30" fill="none" stroke="#FF2A55" stroke-width="3"/>
  <path d="M 30 830 L 30 870 L 70 870" fill="none" stroke="#FF2A55" stroke-width="3"/>
  <path d="M 1570 830 L 1570 870 L 1530 870" fill="none" stroke="#FF2A55" stroke-width="3"/>

  <!-- Top System Badge -->
  <g transform="translate(60, 75)">
    <rect width="190" height="32" rx="4" fill="#181818" stroke="#EEEDE4" stroke-opacity="0.2"/>
    <circle cx="20" cy="16" r="4.5" fill="#FF2A55"/>
    <text x="36" y="21" fill="#EEEDE4" font-family="'Fragment Mono',monospace" font-size="12" font-weight="600" letter-spacing="2">14 // CARDIAC MEDTECH</text>
  </g>

  <!-- Top Right Serial Stamp -->
  <g transform="translate(1360, 75)">
    <text x="180" y="21" fill="#EEEDE4" fill-opacity="0.45" font-family="'Fragment Mono',monospace" font-size="12" letter-spacing="2" text-anchor="end">SYS-ID // 2026.REL</text>
  </g>

  <!-- Bottom Title Block -->
  <g transform="translate(60, 730)">
    <text x="0" y="0" fill="#EEEDE4" font-family="'Inter Display','Inter',sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5">HEART CALCULATOR</text>
    <text x="0" y="34" fill="#FF2A55" font-family="'Fragment Mono',monospace" font-size="14" font-weight="600" letter-spacing="3">CARDIOVASCULAR SCORING &amp; CLINICAL RISK</text>
  </g>

  <!-- Bottom Right Specs Readout -->
  <g transform="translate(1540, 725)">
    <text x="0" y="-36" fill="#EEEDE4" fill-opacity="0.75" font-family="'Fragment Mono',monospace" font-size="13" letter-spacing="1" text-anchor="end">SCORING: Framingham Algorithm</text>
    <text x="0" y="-12" fill="#EEEDE4" fill-opacity="0.75" font-family="'Fragment Mono',monospace" font-size="13" letter-spacing="1" text-anchor="end">PRECISION: Clinical Grade</text>
    <text x="0" y="12" fill="#FF2A55" font-family="'Fragment Mono',monospace" font-size="13" font-weight="600" letter-spacing="1" text-anchor="end">STACK: JavaScript • Modern CSS</text>
  </g>
</svg>