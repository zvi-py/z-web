<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" style="background:#0D0D0D;font-family:'Inter',system-ui,-apple-system,sans-serif;">
  <defs>
    <!-- Grid Pattern -->
    <pattern id="brutalist-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#EEEDE4" stroke-width="0.75" stroke-opacity="0.05"/>
    </pattern>
    <linearGradient id="grad-cover_ecocane" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <!-- Deep Obsidian Canvas -->
  <rect width="1600" height="900" fill="#0E0E0E"/>
  <rect width="1600" height="900" fill="url(#brutalist-grid)"/>

  <!-- Center Graphic Artwork -->
  
          <defs>
            <radialGradient id="ecoglow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#00E676" stop-opacity="0.3"/>
              <stop offset="60%" stop-color="#10B981" stop-opacity="0.12"/>
              <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <circle cx="800" cy="450" r="360" fill="url(#ecoglow)"/>
          <!-- Hexagonal Honeycomb Fiber Matrix -->
          <polygon points="800,310 920,380 920,520 800,590 680,520 680,380" fill="none" stroke="#00E676" stroke-width="2"/>
          <polygon points="940,230 1060,300 1060,440 940,510 820,440 820,300" fill="none" stroke="#10B981" stroke-width="1.5" opacity="0.5"/>
          <polygon points="660,230 780,300 780,440 660,510 540,440 540,300" fill="none" stroke="#10B981" stroke-width="1.5" opacity="0.5"/>
          <circle cx="800" cy="450" r="70" fill="none" stroke="#00E676" stroke-width="2" stroke-dasharray="8 8"/>
          <!-- Seed Funding Seal -->
          <rect x="710" y="425" width="180" height="50" rx="6" fill="#00E676" fill-opacity="0.15" stroke="#00E676" stroke-width="1.5"/>
          <text x="800" y="456" fill="#00E676" font-family="'Fragment Mono',monospace" font-size="16" font-weight="700" letter-spacing="3" text-anchor="middle">₹4.5L FUNDED</text>
        

  <!-- Technical Brutalist Frame Overlay -->
  <rect x="30" y="30" width="1540" height="840" fill="none" stroke="#EEEDE4" stroke-width="1" stroke-opacity="0.12"/>
  <rect x="36" y="36" width="1528" height="828" fill="none" stroke="#00E676" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Corner Reticle Ticks -->
  <path d="M 30 70 L 30 30 L 70 30" fill="none" stroke="#00E676" stroke-width="3"/>
  <path d="M 1570 70 L 1570 30 L 1530 30" fill="none" stroke="#00E676" stroke-width="3"/>
  <path d="M 30 830 L 30 870 L 70 870" fill="none" stroke="#00E676" stroke-width="3"/>
  <path d="M 1570 830 L 1570 870 L 1530 870" fill="none" stroke="#00E676" stroke-width="3"/>

  <!-- Top System Badge -->
  <g transform="translate(60, 75)">
    <rect width="190" height="32" rx="4" fill="#181818" stroke="#EEEDE4" stroke-opacity="0.2"/>
    <circle cx="20" cy="16" r="4.5" fill="#00E676"/>
    <text x="36" y="21" fill="#EEEDE4" font-family="'Fragment Mono',monospace" font-size="12" font-weight="600" letter-spacing="2">02 // GREEN TECH • ₹4.5L</text>
  </g>

  <!-- Top Right Serial Stamp -->
  <g transform="translate(1360, 75)">
    <text x="180" y="21" fill="#EEEDE4" fill-opacity="0.45" font-family="'Fragment Mono',monospace" font-size="12" letter-spacing="2" text-anchor="end">SYS-ID // 2026.REL</text>
  </g>

  <!-- Bottom Title Block -->
  <g transform="translate(60, 730)">
    <text x="0" y="0" fill="#EEEDE4" font-family="'Inter Display','Inter',sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5">ECOCANE</text>
    <text x="0" y="34" fill="#00E676" font-family="'Fragment Mono',monospace" font-size="14" font-weight="600" letter-spacing="3">CIRCULAR BIOMATERIALS &amp; CLEAN TECH</text>
  </g>

  <!-- Bottom Right Specs Readout -->
  <g transform="translate(1540, 725)">
    <text x="0" y="-36" fill="#EEEDE4" fill-opacity="0.75" font-family="'Fragment Mono',monospace" font-size="13" letter-spacing="1" text-anchor="end">SEED GRANT: ₹4,50,000</text>
    <text x="0" y="-12" fill="#EEEDE4" fill-opacity="0.75" font-family="'Fragment Mono',monospace" font-size="13" letter-spacing="1" text-anchor="end">CIRCULARITY: 100%</text>
    <text x="0" y="12" fill="#00E676" font-family="'Fragment Mono',monospace" font-size="13" font-weight="600" letter-spacing="1" text-anchor="end">MATERIAL: Bagasse Bio-Polymers</text>
  </g>
</svg>