<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" style="background:#0D0D0D;font-family:'Inter',system-ui,-apple-system,sans-serif;">
  <defs>
    <!-- Grid Pattern -->
    <pattern id="brutalist-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#EEEDE4" stroke-width="0.75" stroke-opacity="0.05"/>
    </pattern>
    <linearGradient id="grad-cover_ghosted" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- Deep Obsidian Canvas -->
  <rect width="1600" height="900" fill="#0E0E0E"/>
  <rect width="1600" height="900" fill="url(#brutalist-grid)"/>

  <!-- Center Graphic Artwork -->
  
          <defs>
            <radialGradient id="ghostglow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#EC4899" stop-opacity="0.35"/>
              <stop offset="60%" stop-color="#06B6D4" stop-opacity="0.15"/>
              <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <circle cx="800" cy="450" r="350" fill="url(#ghostglow)"/>
          <!-- Neon Cyber Skull / Arcade Token Vector -->
          <path d="M 720 370 C 720 290 880 290 880 370 C 880 430 840 450 840 490 L 760 490 C 760 450 720 430 720 370 Z" fill="none" stroke="#EC4899" stroke-width="3"/>
          <circle cx="760" cy="380" r="14" fill="#06B6D4"/>
          <circle cx="840" cy="380" r="14" fill="#06B6D4"/>
          <line x1="775" y1="465" x2="775" y2="490" stroke="#EC4899" stroke-width="2"/>
          <line x1="800" y1="465" x2="800" y2="490" stroke="#EC4899" stroke-width="2"/>
          <line x1="825" y1="465" x2="825" y2="490" stroke="#EC4899" stroke-width="2"/>
          <!-- 3D Grid Perspective Horizon -->
          <line x1="300" y1="650" x2="1300" y2="650" stroke="#06B6D4" stroke-width="2" opacity="0.6"/>
          <line x1="450" y1="600" x2="1150" y2="600" stroke="#06B6D4" stroke-width="1.5" opacity="0.4"/>
          <line x1="800" y1="520" x2="400" y2="750" stroke="#06B6D4" stroke-width="1.5" opacity="0.5"/>
          <line x1="800" y1="520" x2="1200" y2="750" stroke="#06B6D4" stroke-width="1.5" opacity="0.5"/>
        

  <!-- Technical Brutalist Frame Overlay -->
  <rect x="30" y="30" width="1540" height="840" fill="none" stroke="#EEEDE4" stroke-width="1" stroke-opacity="0.12"/>
  <rect x="36" y="36" width="1528" height="828" fill="none" stroke="#EC4899" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Corner Reticle Ticks -->
  <path d="M 30 70 L 30 30 L 70 30" fill="none" stroke="#EC4899" stroke-width="3"/>
  <path d="M 1570 70 L 1570 30 L 1530 30" fill="none" stroke="#EC4899" stroke-width="3"/>
  <path d="M 30 830 L 30 870 L 70 870" fill="none" stroke="#EC4899" stroke-width="3"/>
  <path d="M 1570 830 L 1570 870 L 1530 870" fill="none" stroke="#EC4899" stroke-width="3"/>

  <!-- Top System Badge -->
  <g transform="translate(60, 75)">
    <rect width="190" height="32" rx="4" fill="#181818" stroke="#EEEDE4" stroke-opacity="0.2"/>
    <circle cx="20" cy="16" r="4.5" fill="#EC4899"/>
    <text x="36" y="21" fill="#EEEDE4" font-family="'Fragment Mono',monospace" font-size="12" font-weight="600" letter-spacing="2">04 // MULTIPLAYER GAME</text>
  </g>

  <!-- Top Right Serial Stamp -->
  <g transform="translate(1360, 75)">
    <text x="180" y="21" fill="#EEEDE4" fill-opacity="0.45" font-family="'Fragment Mono',monospace" font-size="12" letter-spacing="2" text-anchor="end">SYS-ID // 2026.REL</text>
  </g>

  <!-- Bottom Title Block -->
  <g transform="translate(60, 730)">
    <text x="0" y="0" fill="#EEEDE4" font-family="'Inter Display','Inter',sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5">GHOSTED</text>
    <text x="0" y="34" fill="#EC4899" font-family="'Fragment Mono',monospace" font-size="14" font-weight="600" letter-spacing="3">REAL-TIME MULTIPLAYER PARTY GAME</text>
  </g>

  <!-- Bottom Right Specs Readout -->
  <g transform="translate(1540, 725)">
    <text x="0" y="-36" fill="#EEEDE4" fill-opacity="0.75" font-family="'Fragment Mono',monospace" font-size="13" letter-spacing="1" text-anchor="end">LATENCY: &lt;45ms</text>
    <text x="0" y="-12" fill="#EEEDE4" fill-opacity="0.75" font-family="'Fragment Mono',monospace" font-size="13" letter-spacing="1" text-anchor="end">FRAME RATE: 60 FPS</text>
    <text x="0" y="12" fill="#EC4899" font-family="'Fragment Mono',monospace" font-size="13" font-weight="600" letter-spacing="1" text-anchor="end">PROTOCOL: WebSockets • Web Audio</text>
  </g>
</svg>