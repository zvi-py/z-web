<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" style="background:#0D0D0D;font-family:'Inter',system-ui,-apple-system,sans-serif;">
  <defs>
    <!-- Grid Pattern -->
    <pattern id="brutalist-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#EEEDE4" stroke-width="0.75" stroke-opacity="0.05"/>
    </pattern>
    <linearGradient id="grad-cover_trainllm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3366"/>
      <stop offset="100%" stop-color="#FF7700"/>
    </linearGradient>
  </defs>

  <!-- Deep Obsidian Canvas -->
  <rect width="1600" height="900" fill="#0E0E0E"/>
  <rect width="1600" height="900" fill="url(#brutalist-grid)"/>

  <!-- Center Graphic Artwork -->
  
          <defs>
            <radialGradient id="llmglow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#FF3366" stop-opacity="0.35"/>
              <stop offset="60%" stop-color="#FF7700" stop-opacity="0.14"/>
              <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <circle cx="800" cy="450" r="350" fill="url(#llmglow)"/>
          <!-- Transformer Attention Matrix Heatmap -->
          <rect x="620" y="320" width="360" height="260" rx="10" fill="#121212" stroke="#FF3366" stroke-width="2"/>
          <line x1="620" y1="385" x2="980" y2="385" stroke="#FF7700" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>
          <line x1="620" y1="450" x2="980" y2="450" stroke="#FF7700" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>
          <line x1="620" y1="515" x2="980" y2="515" stroke="#FF7700" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>
          <!-- Active Weights -->
          <circle cx="710" cy="385" r="14" fill="#FF3366"/>
          <circle cx="800" cy="450" r="22" fill="#FF7700"/>
          <circle cx="890" cy="515" r="16" fill="#FF3366"/>
          <!-- Loss Curve -->
          <path d="M 640 550 Q 750 530 800 420 T 960 350" fill="none" stroke="#EEEDE4" stroke-width="3"/>
        

  <!-- Technical Brutalist Frame Overlay -->
  <rect x="30" y="30" width="1540" height="840" fill="none" stroke="#EEEDE4" stroke-width="1" stroke-opacity="0.12"/>
  <rect x="36" y="36" width="1528" height="828" fill="none" stroke="#FF3366" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Corner Reticle Ticks -->
  <path d="M 30 70 L 30 30 L 70 30" fill="none" stroke="#FF3366" stroke-width="3"/>
  <path d="M 1570 70 L 1570 30 L 1530 30" fill="none" stroke="#FF3366" stroke-width="3"/>
  <path d="M 30 830 L 30 870 L 70 870" fill="none" stroke="#FF3366" stroke-width="3"/>
  <path d="M 1570 830 L 1570 870 L 1530 870" fill="none" stroke="#FF3366" stroke-width="3"/>

  <!-- Top System Badge -->
  <g transform="translate(60, 75)">
    <rect width="190" height="32" rx="4" fill="#181818" stroke="#EEEDE4" stroke-opacity="0.2"/>
    <circle cx="20" cy="16" r="4.5" fill="#FF3366"/>
    <text x="36" y="21" fill="#EEEDE4" font-family="'Fragment Mono',monospace" font-size="12" font-weight="600" letter-spacing="2">11 // LLM PIPELINE</text>
  </g>

  <!-- Top Right Serial Stamp -->
  <g transform="translate(1360, 75)">
    <text x="180" y="21" fill="#EEEDE4" fill-opacity="0.45" font-family="'Fragment Mono',monospace" font-size="12" letter-spacing="2" text-anchor="end">SYS-ID // 2026.REL</text>
  </g>

  <!-- Bottom Title Block -->
  <g transform="translate(60, 730)">
    <text x="0" y="0" fill="#EEEDE4" font-family="'Inter Display','Inter',sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5">TRAINLLM</text>
    <text x="0" y="34" fill="#FF3366" font-family="'Fragment Mono',monospace" font-size="14" font-weight="600" letter-spacing="3">PEFT / LORA FINE-TUNING PIPELINE</text>
  </g>

  <!-- Bottom Right Specs Readout -->
  <g transform="translate(1540, 725)">
    <text x="0" y="-36" fill="#EEEDE4" fill-opacity="0.75" font-family="'Fragment Mono',monospace" font-size="13" letter-spacing="1" text-anchor="end">METHOD: LoRA Rank-8 / PEFT</text>
    <text x="0" y="-12" fill="#EEEDE4" fill-opacity="0.75" font-family="'Fragment Mono',monospace" font-size="13" letter-spacing="1" text-anchor="end">PRECISION: INT8 / FP16</text>
    <text x="0" y="12" fill="#FF3366" font-family="'Fragment Mono',monospace" font-size="13" font-weight="600" letter-spacing="1" text-anchor="end">STACK: PyTorch • Hugging Face • React</text>
  </g>
</svg>